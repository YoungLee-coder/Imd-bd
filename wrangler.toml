name = "ims-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 本地可直接跑。上线前用 `wrangler secret put JWT_SECRET` 覆盖。
[vars]
JWT_SECRET = "ims-dev-change-me"

[[d1_databases]]
binding = "DB"
database_name = "ims"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ims-files"
